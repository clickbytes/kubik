name: Stage 1 build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo test --workspace
      - run: cargo build --locked -p kubik-server
      - run: node scripts/smoke-server.mjs
      - run: cargo install wasm-pack --locked
      - run: npm ci --prefix apps/client
      - run: npm run build:worldgen --prefix apps/client
      - run: wasm-pack build crates/worldgen --target nodejs --out-dir pkg-node
      - run: node crates/worldgen/tests/compare_wasm.cjs
      - run: npm run build --prefix apps/client
