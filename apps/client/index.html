<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>KUBIK — Planet Explorer</title>
  </head>
  <body>
    <canvas id="globe" aria-label="Interactive spherical planet"></canvas>
    <div id="hud">
      <header><strong>KUBIK</strong><span>Stage 1 planet explorer</span></header>
      <div id="status" role="status">Loading world configuration…</div>
      <div id="metrics"></div>
      <p class="targets">Working targets: ≥30 FPS · chunk p95 ≤16 ms</p>
      <p>Drag to orbit · Scroll to zoom · Double click to reset</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
